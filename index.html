'use strict';
const HALLS=['H1','H2','H3','H4','H5','H6','H8','H9','H101','H102'];
const PARK=['Zaparkowany przy płocie','Zaparkowany na skos','Do zabrania na prostej'];
const $=id=>document.getElementById(id);
const SUPABASE_URL='https://yobcirzellqmlrtognga.supabase.co';
const SUPABASE_KEY='sb_publishable_QHts5MIyUTRIRR2fAH14ZA_WYUif27n';
const PUSH_PUBLIC_KEY='BGRgyKSi8459u05izWXzGHadHMXXP_9bvDCyJvbXLWuEh9RrQ4P2LDXaHNANdmvtTS_8RzPwFQJ2MhL8exKi98M';
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
let onlineReady=false, applyingRemote=false, lastRemoteAt=0;
const els={ns:$('ns'),st:$('st'),fi:$('fi'),drivers:$('drivers'),daily:$('daily'),hallCounts:$('hallCounts'),messages:$('messages'),hallChecks:$('hallChecks'),modal:$('modal'),mt:$('mt'),mb:$('mb'),mok:$('mok'),chatInput:$('chatInput'),driverSearch:$('driverSearch'),sSearch:$('sSearch'),sDrivers:$('sDrivers'),sMessages:$('sMessages'),sChatInput:$('sChatInput'),name:$('name'),reg:$('reg'),phone:$('phone'),company:$('company'),info:$('info')};
let S={drivers:[],messages:[]};
try{const saved=JSON.parse(localStorage.getItem('PLAN_KIEROWCOW')||'null');if(saved&&typeof saved==='object')S=saved;}catch(e){}
if(!Array.isArray(S.drivers))S.drivers=[];if(!Array.isArray(S.messages))S.messages=[];
function normalize(){S.drivers.forEach(d=>{if(!Array.isArray(d.order))d.order=[];d.order=d.order.filter(h=>HALLS.includes(h));if(!d.status||typeof d.status!=='object')d.status={};d.order.forEach(h=>{if(!['red','green','yellow','blue'].includes(d.status[h]))d.status[h]='red';});d.started=!!d.started;d.finished=!!d.finished;d.parking=d.parking||'';d.info=d.info||'';d.verified=!!d.verified;d.indifferent=!!d.indifferent;d.drugieKlonnice=!!d.drugieKlonnice;d.srodkoweKlonnice=!!d.srodkoweKlonnice;});}
normalize();
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function save(){localStorage.setItem('PLAN_KIEROWCOW',JSON.stringify(S));render();if(onlineReady&&!applyingRemote){try{const payload={id:1,data:S,updated_at:new Date().toISOString()};const {error}=await sb.from('app_state').upsert(payload,{onConflict:'id'});if(error)console.error('Supabase save:',error);}catch(e){console.error('Supabase save:',e);}}}
function tab(x){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));$(x).classList.add('active');document.querySelector('.counters').style.display=x==='s'?'none':'flex';document.querySelector('header .chat').style.display=x==='s'?'none':'block';render();window.scrollTo(0,0);}
function get(id){return S.drivers.find(d=>d.id===id);}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
let notifyEnabled=false;
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function enableNotifications(){try{if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)){alert('Ta przeglądarka nie obsługuje prawdziwych powiadomień push.');return false;}const p=await Notification.requestPermission();if(p!=='granted'){notifyEnabled=false;alert('Powiadomienia zostały zablokowane. Włącz je w ustawieniach przeglądarki.');return false;}const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(PUSH_PUBLIC_KEY)});}const json=sub.toJSON();const {error}=await sb.from('push_subscriptions').upsert({endpoint:json.endpoint,subscription:json,updated_at:new Date().toISOString()},{onConflict:'endpoint'});if(error)throw error;notifyEnabled=true;alert('Powiadomienia push są włączone. Ten telefon będzie dostawał wiadomości także przy zamkniętej aplikacji i zablokowanym ekranie.');return true;}catch(e){console.error('Push:',e);alert('Nie udało się włączyć powiadomień push: '+(e?.message||e));return false;}}
function notifySystem(title,body){try{if(!notifyEnabled||Notification.permission!=='granted'||document.visibilityState==='visible')return;const opts={body,icon:'/icon-192.png',badge:'/icon-192.png',tag:'plan-pracy',renotify:true,vibrate:[250,120,250,120,500],requireInteraction:true};if(navigator.serviceWorker?.controller){navigator.serviceWorker.controller.postMessage({type:'NOTIFY',title,options:opts});}else new Notification(title,opts);}catch(e){}}
function notifySound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=window.__chatAudio||(window.__chatAudio=new C());if(c.state==='suspended')c.resume();const now=c.currentTime;const seq=[0,0.18,0.36,0.54,0.72];const freq=[880,1175,880,1175,988];seq.forEach((off,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i===4?'square':'sine';o.frequency.value=freq[i];g.gain.setValueAtTime(0.0001,now+off);g.gain.exponentialRampToValueAtTime(1.0,now+off+0.012);g.gain.exponentialRampToValueAtTime(0.0001,now+off+0.16);o.connect(g);g.connect(c.destination);o.start(now+off);o.stop(now+off+0.17);});}catch(e){}}
function addMsg(t,silent=false){S.messages.unshift({t,time:new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})});S.messages=S.messages.slice(0,100);if(!silent)notifySound();}
async function sendMsg(){const v=els.chatInput.value.trim();if(!v)return;addMsg(v);els.chatInput.value='';save();try{const {error}=await sb.from('push_notifications').insert({body:v});if(error)console.error('Push notification insert:',error);}catch(e){console.error('Push notification:',e);}}
els.chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});els.sChatInput?.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsgS();});function sendMsgS(){const v=els.sChatInput.value.trim();if(!v)return;addMsg(v);els.sChatInput.value='';save();try{sb.from('push_notifications').insert({body:v}).then(({error})=>{if(error)console.error('Push notification insert:',error);});}catch(e){console.error('Push notification:',e);}}
els.phone.addEventListener('input',()=>{els.phone.value=els.phone.value.replace(/\D/g,'');});
async function loadOnline(){
  if(!sb)return;
  try{
    const {data,error}=await sb.from('app_state').select('data').eq('id',1).maybeSingle();
    if(error){console.error('Supabase load:',error);return;}
    if(data?.data&&typeof data.data==='object'){S=data.data;normalize();localStorage.setItem('PLAN_KIEROWCOW',JSON.stringify(S));render();}
    else {await sb.from('app_state').upsert({id:1,data:S,updated_at:new Date().toISOString()},{onConflict:'id'});}
    onlineReady=true;
    sb.channel('app-state-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_state',filter:'id=eq.1'},payload=>{
      const incoming=payload.new?.data;
      if(!incoming||applyingRemote)return;
      applyingRemote=true;
      const oldMessages=Array.isArray(S.messages)?S.messages:[];
      S=incoming;normalize();localStorage.setItem('PLAN_KIEROWCOW',JSON.stringify(S));render();
      const newMessages=Array.isArray(S.messages)?S.messages:[];
      if(newMessages.length>oldMessages.length){
        notifySound();
        const newest=newMessages[0];
        notifySystem('PLAN PRACY',newest?.t||'Nowa wiadomość');
      }
      applyingRemote=false;
    }).subscribe(status=>console.log('Realtime:',status));
  }catch(e){console.error('Supabase init:',e);}
}
function addDriver(){const n=els.name.value.trim();const order=[...document.querySelectorAll('#hallChecks input:checked')].map(x=>x.value);if(!n){alert('Podaj imię i nazwisko.');els.name.focus();return;}if(!order.length){alert('Zaznacz przynajmniej jedną halę.');return;}const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'_'+Math.random();const d={id,name:n,reg:els.reg.value.trim().toUpperCase(),phone:els.phone.value.replace(/\D/g,''),company:els.company.value.trim(),order,status:Object.fromEntries(order.map(h=>[h,'red'])),parking:'',verified:false,indifferent:false,drugieKlonnice:false,srodkoweKlonnice:false,started:false,finished:false,info:els.info.value.trim()};S.drivers.push(d);addMsg('Dodano kierowcę: '+n);[els.name,els.reg,els.phone,els.company,els.info].forEach(x=>x.value='');document.querySelectorAll('#hallChecks input').forEach(x=>{x.checked=false;x.closest('label').classList.remove('selected');});save();tab('plan');}

function closeM(){els.modal.classList.remove('show');}
function confirmBox(t,b,cb){openM(t,'<p>'+esc(b)+'</p>',cb);}
function start(id){const d=get(id);if(!d)return;confirmBox('START','Rozpocząć pracę kierowcy '+d.name+'?',()=>{d.started=true;addMsg(d.name+' rozpoczął pracę');save();});}
function finish(id){const d=get(id);if(!d)return;confirmBox('ZAKOŃCZ','Czy na pewno zakończyć '+d.name+'?',()=>{d.finished=true;d.started=true;addMsg(d.name+' zakończył pracę');save();});}
function back(id){const d=get(id);if(!d)return;confirmBox('WRÓĆ','Cofnąć zakończenie kierowcy?',()=>{d.finished=false;save();});}
function del(id){confirmBox('USUŃ','Usunąć tego kierowcę z dzisiejszej listy?',()=>{S.drivers=S.drivers.filter(d=>d.id!==id);save();});}
function deleteAll(){confirmBox('PIERWSZE POTWIERDZENIE','Usunąć całą dzisiejszą listę?',()=>{confirmBox('DRUGIE POTWIERDZENIE','OSTATNIE POTWIERDZENIE — usuń wszystkich kierowców.',()=>{S.drivers=[];save();});});}
function setParking(id,v){const d=get(id);if(d){d.parking=v;save();}}
function check(id,k,v){const d=get(id);if(d){d[k]=v;save();}}
function statusText(v){return v==='red'?'NIE GOTOWA':v==='green'?'GOTOWA':v==='yellow'?'W HALI':'NASTĘPNA HALA';}
function hall(id,h){const d=get(id);if(!d)return;const opts=[['red','NIE GOTOWA'],['green','GOTOWA'],['yellow','W HALI'],['blue','NASTĘPNA HALA']];openM('STATUS '+h,'<div class="choices">'+opts.map(o=>'<button type="button" class="status-'+o[0]+'" onclick="statusPick(\''+id+'\',\''+h+'\',\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</div>',null);}
function statusPick(id,h,v){closeM();const d=get(id);if(!d)return;confirmBox('POTWIERDŹ','Zmienić status '+h+' na '+statusText(v)+'?',()=>{d.status[h]=v;addMsg(d.name+' — '+h+' — '+statusText(v));save();});}
function moveHall(id,i,dir){const d=get(id);if(!d)return;const j=i+dir;if(j<0||j>=d.order.length)return;[d.order[i],d.order[j]]=[d.order[j],d.order[i]];d.verified=false;save();order(id);}
function toggleKlonnice(id,k,v){const d=get(id);if(!d)return;d[k]=v;save();order(id);}
function removeHall(id,i){const d=get(id);if(!d||i<0||i>=d.order.length)return;const h=d.order[i];confirmBox('USUŃ HALĘ','Usunąć '+h+' z kolejności tego kierowcy?',()=>{d.order.splice(i,1);if(d.status&&Object.prototype.hasOwnProperty.call(d.status,h))delete d.status[h];d.verified=false;addMsg(d.name+' — usunięto '+h+' z kolejności');save();order(id);});}
function addHallToOrder(id,h){const d=get(id);if(!d||d.order.includes(h))return;d.order.push(h);if(!d.status||typeof d.status!=='object')d.status={};d.status[h]='red';d.verified=false;addMsg(d.name+' — dodano '+h+' do kolejności');save();order(id);}
function order(id){const d=get(id);if(!d)return;const rows=d.order.map((h,i)=>'<div class="orderrow"><b>'+(i+1)+'. '+h+'</b><button type="button" class="arrow" onclick="moveHall(\''+id+'\','+i+',-1)">▲</button><button type="button" class="arrow" onclick="moveHall(\''+id+'\','+i+',1)">▼</button><button type="button" class="removeHall" onclick="removeHall(\''+id+'\','+i+')" aria-label="Usuń halę">×</button></div>').join('');const available=HALLS.filter(h=>!d.order.includes(h));const adds=available.length?'<div class="addhall">'+available.map(h=>'<button type="button" onclick="addHallToOrder(\''+id+'\',\''+h+'\')">+ '+h+'</button>').join('')+'</div>':'<div class="special">Wszystkie hale są dodane.</div>';const body='<div>'+rows+'</div>'+adds+'<div class="klonnice"><label><input type="checkbox" '+(d.drugieKlonnice?'checked':'')+' onchange="toggleKlonnice(\''+id+'\',\'drugieKlonnice\',this.checked)"> DRUGIE KLONNICE</label><label><input type="checkbox" '+(d.srodkoweKlonnice?'checked':'')+' onchange="toggleKlonnice(\''+id+'\',\'srodkoweKlonnice\',this.checked)"> ŚRODKOWE KLONNICE</label></div>';openM('KOLEJNOŚĆ',body,null);}
function editInfo(id){const d=get(id);if(!d)return;const v=prompt('Informacje dla '+d.name,d.info||'');if(v!==null){d.info=v;save();}}
function card(d){const cls=d.finished?'finished':d.started?'working':'notstarted';let special=[d.drugieKlonnice?'DRUGIE KLONNICE':'',d.srodkoweKlonnice?'ŚRODKOWE KLONNICE':''].filter(Boolean).join(' / ');const halls=d.order.map(h=>'<button type="button" class="hall '+(d.finished?'gray':(d.status[h]||'red'))+'" onclick="hall(\''+d.id+'\',\''+h+'\')">'+esc(h)+'</button>').join('');return '<div class="card '+cls+'" data-driver-id="'+esc(d.id)+'"><div class="actions"><button type="button" class="start" onclick="start(\''+d.id+'\')">START</button><button type="button" class="order" onclick="order(\''+d.id+'\')">KOLEJNOŚĆ</button></div><div class="top"><div class="initials">'+esc(initials(d.name))+'</div><div><div class="name">'+esc(d.name)+'</div><div class="meta">'+esc((d.reg||'').toUpperCase())+(d.phone?' · <a href="tel:'+esc(d.phone)+'">'+esc(d.phone)+'</a>':'')+'</div></div></div><div class="halls">'+halls+'</div>'+(special?'<div class="special">'+special+'</div>':'')+'<div class="inlinechecks"><label class="'+(d.verified?'selected':'')+'"><input type="checkbox" '+(d.verified?'checked':'')+' onchange="check(\''+d.id+'\',\'verified\',this.checked)"><span class="checkMain">Kolejność<br><span class="checkSub">zatwierdzona</span></span></label><label class="'+(d.indifferent?'selected':'')+'"><input type="checkbox" '+(d.indifferent?'checked':'')+' onchange="check(\''+d.id+'\',\'indifferent\',this.checked)"><span class="checkMain">Kolejność<br><span class="checkSub">obojętna</span></span></label><select class="parkingInline" onchange="setParking(\''+d.id+'\',this.value)"><option value="">Parking</option>'+PARK.map(x=>'<option value="'+esc(x)+'" '+(d.parking===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div><div class="info"><b>Informacje:</b> '+esc(d.info||'brak')+' <button type="button" class="editInfo" onclick="editInfo(\''+d.id+'\')">✎</button></div><div class="bottom"><button type="button" class="finish" onclick="finish(\''+d.id+'\')">ZAKOŃCZ</button></div></div>'; }
function goPlan(id){tab('plan');setTimeout(()=>{const el=document.querySelector('[data-driver-id="'+id+'"]');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='3px solid #3b82f6';setTimeout(()=>el.style.outline='',1800);}},60);}
function sCard(d){const cls=d.finished?'finished':d.started?'working':'notstarted';const halls=d.order.map(h=>'<button type="button" class="hall '+(d.finished?'gray':(d.status[h]||'red'))+'" onclick="hall(\''+d.id+'\',\''+h+'\')">'+esc(h)+'</button>').join('');return '<div class="sdriver '+cls+'"><button type="button" class="sstart" onclick="start(\''+d.id+'\')">START</button><div class="sname">'+esc(d.name)+'</div><div class="sreg">'+esc((d.reg||'').toUpperCase())+'</div><div class="shalls">'+halls+'</div><button type="button" class="sarrow" onclick="goPlan(\''+d.id+'\')">›</button></div>'; }
function renderS(){if(!els.sDrivers)return;const q=(els.sSearch?.value||'').trim().toLocaleLowerCase('pl-PL');const ds=[...S.drivers].sort((a,b)=>{const rank=d=>d.finished?2:d.started?0:1;return rank(a)-rank(b);}).filter(d=>!q||(d.name||'').toLocaleLowerCase('pl-PL').includes(q)||(d.reg||'').toLocaleLowerCase('pl-PL').includes(q));els.sDrivers.innerHTML=ds.length?ds.map(sCard).join(''):(q?'<div class="formbox"><b>Nie znaleziono kierowcy.</b></div>':'');els.sMessages.innerHTML=S.messages.map(m=>'<div class="msg"><small>'+esc(m.time)+'</small>'+esc(m.t)+'</div>').join('');els.sMessages.scrollTop=0;}
function render(){const q=(els.driverSearch?.value||'').trim().toLocaleLowerCase('pl-PL');const ds=[...S.drivers].sort((a,b)=>{const rank=d=>d.finished?2:d.started?0:1;return rank(a)-rank(b);}).filter(d=>{if(!q)return true;return (d.name||'').toLocaleLowerCase('pl-PL').includes(q)||(d.reg||'').toLocaleLowerCase('pl-PL').includes(q);});els.ns.textContent=S.drivers.filter(d=>!d.started&&!d.finished).length;els.st.textContent=S.drivers.filter(d=>d.started&&!d.finished).length;els.fi.textContent=S.drivers.filter(d=>d.finished).length;els.drivers.innerHTML=ds.length?ds.map(card).join(''):(q?'<div class="formbox"><b>Nie znaleziono kierowcy.</b><div style="color:var(--muted);margin-top:5px">Szukaj po nazwisku lub numerze rejestracyjnym.</div></div>':'');els.daily.innerHTML=S.drivers.length?S.drivers.map(d=>'<div class="listitem"><span>'+esc(d.name)+' — '+esc((d.reg||'').toUpperCase())+'</span><button type="button" class="danger" onclick="del(\''+d.id+'\')">USUŃ</button></div>').join(''):'<p style="color:var(--muted)">Brak kierowców.</p>';els.hallCounts.innerHTML=HALLS.map(h=>'<div class="hcount"><b>'+h+'</b><span>'+S.drivers.filter(d=>!d.finished&&d.order.includes(h)&&d.status[h]!=='green').length+'</span></div>').join('');els.messages.innerHTML=S.messages.map(m=>'<div class="msg"><small>'+esc(m.time)+'</small>'+esc(m.t)+'</div>').join('');els.messages.scrollTop=0;renderS();}
els.hallChecks.innerHTML=HALLS.map(h=>'<label><input type="checkbox" value="'+h+'"> '+h+'</label>').join('');document.querySelectorAll('#hallChecks label').forEach(l=>{const i=l.querySelector('input');const sync=()=>l.classList.toggle('selected',i.checked);l.addEventListener('click',()=>setTimeout(sync,0));sync();});
render();
els.driverSearch?.addEventListener('input',render);els.sSearch?.addEventListener('input',renderS);
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
loadOnline();
</script></body></html>
